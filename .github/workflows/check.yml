# Checks the database on every push and pull request: each repo it lists names a package in
# the package.rant at its root, and no two name the same.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/check.py
